<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F4F8F2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icono-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tu cumple">
  <meta property="og:title" content="Tu cumple 🎂">
  <meta property="og:description" content="Una aventura de cumpleaños con recuerdos. 🎉">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/og-torta.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <title>Feliz cumpleaños amor</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- ============ PORTADA ============ -->
  <main id="pantalla-portada" class="pantalla activa">
    <div class="carta">
      <div class="torta" aria-hidden="true">🎂</div>
      <h1 class="titulo"></h1>
      <div class="corazon" aria-hidden="true"></div>
      <p class="frase"></p>
      <button class="boton" type="button" id="btn-empezar"></button>
    </div>
    <p id="pwa-tip" class="pwa-tip oculto"></p>
  </main>

  <!-- ============ VIAJE ============ -->
  <section id="pantalla-viaje" class="pantalla viaje oculto">
    <div class="encabezado">
      <span id="v-encabezado"></span>
    </div>

    <div class="intro-card"><p id="v-intro"></p></div>

    <div class="mini-km"><span id="v-km">0,0</span> km recorridos</div>
    <div id="modo-prueba" class="modo-prueba oculto">MODO PRUEBA · km sumados de prueba</div>

    <div class="aviso-gps oculto" id="aviso-gps">
      <p id="t-aviso-gps"></p>
      <button id="btn-reintentar" class="boton-chico"></button>
    </div>

    <div id="v-buscando" class="buscando"></div>

    <div id="mapa-wrap" class="oculto mapa-wrap">
      <div id="mapa"></div>
      <p class="mini-aviso">Recorrido en tiempo real</p>
    </div>

    <button id="btn-terminar" class="boton oculto"></button>
  </section>

  <!-- ============ MODAL EVENTO (pista / destino) ============ -->
  <div id="modal-evento" class="modal">
    <div class="modal-carta">
      <span class="modal-sello" id="m-sello">🎁 PISTA</span>
      <h2 id="m-titulo"></h2>
      <p id="m-texto"></p>
      <input type="text" id="m-input" class="modal-input oculto" autocomplete="off" autocapitalize="sentences">
      <button id="m-subir-foto" class="boton oculto"></button>
      <button id="m-cerrar" class="boton-chico"></button>
    </div>
  </div>

  <input type="file" id="input-foto" accept="image/*" capture="environment" hidden>

  <!-- ============ FINAL ============ -->
  <section id="pantalla-final" class="pantalla final oculto">
    <div class="encabezado"><span class="titulo-final"></span></div>
    <p id="f-mensaje" class="frase"></p>
    <div id="mapa-final-wrap" class="mapa-wrap oculto">
      <div id="mapa-final"></div>
    </div>
    <div id="galeria" class="galeria"></div>
    <button id="btn-reiniciar" class="boton"></button>
  </section>

  <!-- ============ LIGHTBOX ============ -->
  <div id="lightbox" class="lightbox oculto">
    <img id="lightbox-img" alt="Recuerdo">
  </div>

  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
