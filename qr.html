<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>QR del cumple</title>
<style>
  /* La tarjeta se arma con los mismos colores y la misma tipografía que la app.
     Está escalada a A4 (2480x3508 = 300 dpi) y se convierte en una sola imagen
     con tools/qr.js, para imprimir. No es una página de la app. */
  :root {
    --fondo: #F4F8F2;
    --tinta: #5A5560;
    --tinta-suave: #8A8491;
    --rosa: #E8A0B4;
    --verde: #A9C3A0;
    --blanco: #FFFFFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2480px; height: 3508px; }
  body {
    background: var(--fondo);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  /* El diseño está hecho a 1080x1350 y se escala entero, así que las
     proporciones son las mismas que en la versión para el chat. */
  .hoja {
    width: 1080px;
    height: 1350px;
    transform: scale(2.2963);
    transform-origin: center center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--tinta);
  }
  .torta {
    font-size: 104px;
    line-height: 1;
    filter: drop-shadow(0 10px 16px rgba(169, 195, 160, 0.5));
  }
  .corazon {
    position: relative;
    width: 96px;
    height: 86px;
  }
  .corazon::before,
  .corazon::after {
    content: "";
    position: absolute;
    width: 48px;
    height: 77px;
    background: var(--rosa);
    filter: drop-shadow(0 8px 14px rgba(232, 160, 180, 0.5));
  }
  .corazon::before {
    left: 48px;
    transform: rotate(-45deg);
    transform-origin: 0 100%;
    border-radius: 48px 48px 0 0;
  }
  .corazon::after {
    left: 0;
    transform: rotate(45deg);
    transform-origin: 100% 100%;
    border-radius: 48px 48px 0 0;
  }
  .titulo {
    font-size: 78px;
    font-weight: normal;
    line-height: 1.15;
    text-align: center;
    max-width: 920px;
  }
  .regla {
    width: 120px;
    height: 3px;
    border-radius: 3px;
    background: var(--verde);
  }
  /* El QR va sobre un cuadrado blanco con aire alrededor: la cámara necesita
     ese margen para leerlo, y el blanco es lo que hace que se lea siempre. */
  .qr {
    background: var(--blanco);
    border: 2px solid var(--verde);
    border-radius: 36px;
    padding: 84px;
    box-shadow: 0 18px 40px rgba(169, 195, 160, 0.32);
    line-height: 0;
  }
  .qr svg { width: 520px; height: 520px; display: block; }
  .pie {
    font-size: 44px;
    font-style: italic;
    text-align: center;
    color: var(--tinta);
  }
</style>
</head>
<body>
  <div class="hoja">
    <div class="torta">🎂</div>
    <div class="corazon" aria-hidden="true"></div>
    <h1 class="titulo">Feliz cumpleaños amor</h1>
    <div class="regla" aria-hidden="true"></div>
    <div class="qr"><svg width="580" height="580" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 29 29" shape-rendering="crispEdges"><path stroke="#5A5560" d="M0 0.5h7m1 0h2m3 0h3m2 0h3m1 0h7M0 1.5h1m5 0h1m1 0h1m1 0h1m1 0h2m2 0h3m1 0h1m1 0h1m5 0h1M0 2.5h1m1 0h3m1 0h1m2 0h1m1 0h1m4 0h1m1 0h1m1 0h1m1 0h1m1 0h3m1 0h1M0 3.5h1m1 0h3m1 0h1m1 0h1m5 0h2m1 0h1m2 0h1m1 0h1m1 0h3m1 0h1M0 4.5h1m1 0h3m1 0h1m4 0h1m2 0h1m1 0h4m2 0h1m1 0h3m1 0h1M0 5.5h1m5 0h1m5 0h2m1 0h3m1 0h1m2 0h1m5 0h1M0 6.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M8 7.5h1m2 0h1m3 0h3m1 0h1M0 8.5h1m1 0h2m1 0h3m4 0h2m1 0h1m1 0h2m3 0h1m2 0h1m1 0h2M0 9.5h1m1 0h1m1 0h2m2 0h8m2 0h2m1 0h4m3 0h1M0 10.5h1m2 0h1m2 0h1m2 0h1m1 0h1m1 0h1m2 0h1m9 0h2M0 11.5h2m1 0h1m1 0h1m2 0h4m4 0h1m1 0h5m1 0h1m3 0h1M0 12.5h1m5 0h2m4 0h1m1 0h2m1 0h1m3 0h1m3 0h2M1 13.5h3m3 0h1m1 0h2m3 0h1m1 0h2m1 0h1m2 0h1m3 0h3M4 14.5h3m2 0h2m2 0h1m1 0h2m1 0h2m1 0h1m4 0h3M1 15.5h3m1 0h1m2 0h1m1 0h2m2 0h1m1 0h1m3 0h1m2 0h2m2 0h1M0 16.5h1m1 0h2m2 0h1m2 0h1m1 0h2m1 0h2m2 0h4m1 0h3m1 0h1M2 17.5h2m4 0h2m1 0h1m2 0h1m1 0h2m2 0h1m2 0h1m1 0h3M0 18.5h1m2 0h1m1 0h6m2 0h4m4 0h1m1 0h2m1 0h1M2 19.5h3m3 0h1m1 0h8m2 0h4m2 0h1M1 20.5h1m1 0h9m1 0h5m1 0h8M8 21.5h2m2 0h1m4 0h4m3 0h5M0 22.5h7m1 0h3m3 0h1m3 0h3m1 0h1m1 0h2m1 0h1M0 23.5h1m5 0h1m1 0h1m2 0h4m1 0h1m3 0h1m3 0h2m2 0h1M0 24.5h1m1 0h3m1 0h1m4 0h1m3 0h3m2 0h5m1 0h2M0 25.5h1m1 0h3m1 0h1m1 0h2m3 0h1m1 0h3m1 0h3m1 0h3m2 0h1M0 26.5h1m1 0h3m1 0h1m1 0h2m3 0h1m2 0h1m3 0h2m1 0h1m2 0h1m1 0h1M0 27.5h1m5 0h1m2 0h1m2 0h4m4 0h1m4 0h1m1 0h1M0 28.5h7m1 0h1m4 0h2m1 0h1m1 0h4m2 0h1m2 0h1"/></svg>
</div>
    <p class="pie">Escanea y disfruta tu día</p>
  </div>
</body>
</html>
